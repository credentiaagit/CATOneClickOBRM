{% extends "base.html" %}

{% block title %}Login - Oracle BRM Dashboard{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-modal">
        <div class="auth-header">
            <h1><i class="fas fa-database"></i> Oracle BRM Dashboard</h1>
            <p>Sign in to access your BRM management tools</p>
        </div>
        
        <div class="auth-tabs">
            <a href="{{ url_for('login') }}" class="tab-btn active">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </a>
            <a href="{{ url_for('register') }}" class="tab-btn">
                <i class="fas fa-user-plus"></i> Sign Up
            </a>
        </div>
        
        <form method="POST" class="auth-form active">
            <div class="form-group">
                <label for="username">
                    <i class="fas fa-user"></i> Username
                </label>
                <input type="text" id="username" name="username" required 
                       placeholder="Enter your username" autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i> Password
                </label>
                <input type="password" id="password" name="password" required 
                       placeholder="Enter your password" autocomplete="current-password">
            </div>
            
            <button type="submit" class="btn btn-primary btn-full">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>
        
        <div class="auth-footer">
            <p>Default credentials:</p>
            <p><strong>Admin:</strong> admin / admin123</p>
            <p><strong>User:</strong> suresh / suresh123</p>
        </div>
    </div>
</div>
{% endblock %}
