[package]
name = "oneclick_brm_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
actix-cors = "0.6"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.10"
toml = "0.8"
log = "0.4"
lazy_static = "1.4"
regex = "1.10"
rand = "0.8"
zip = "0.6"
tempfile = "3.8"
actix-multipart = "0.6"
futures-util = "0.3"
